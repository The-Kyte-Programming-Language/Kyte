name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "21"
  LLVM_WIN_VERSION: "21.1.0"

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── LLVM 설치 (Linux) ─────────────────────────────────────────────────────
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ env.LLVM_VERSION }} all
          sudo apt-get install -y libpolly-${{ env.LLVM_VERSION }}-dev 2>/dev/null || true
          echo "LLVM_SYS_211_PREFIX=/usr/lib/llvm-${{ env.LLVM_VERSION }}" >> $GITHUB_ENV
          echo "/usr/lib/llvm-${{ env.LLVM_VERSION }}/bin" >> $GITHUB_PATH

      # ── LLVM 설치 (macOS) ─────────────────────────────────────────────────────
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@${{ env.LLVM_VERSION }}
          LLVM_PREFIX=$(brew --prefix llvm@${{ env.LLVM_VERSION }})
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX" >> $GITHUB_ENV
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH

      # ── LLVM 설치 (Windows) ───────────────────────────────────────────────────
      # LLVM-*.win64.exe (NSIS 인스톨러)는 엔드유저용 런타임 배포판으로
      # llvm-config.exe 와 개발 라이브러리가 포함되지 않음.
      # clang+llvm-*-x86_64-pc-windows-msvc.tar.xz 는 개발자용 전체 툴체인으로
      # llvm-config.exe, 헤더, .lib 파일이 모두 포함됨.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ env.LLVM_WIN_VERSION }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$ver/clang+llvm-$ver-x86_64-pc-windows-msvc.tar.xz"
          $archive = "$env:RUNNER_TEMP\llvm.tar.xz"
          $llvmDir = "C:\LLVM"
          Write-Host "Downloading LLVM $ver dev toolchain..."
          Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
          Write-Host "Extracting to $llvmDir..."
          New-Item -ItemType Directory -Force $llvmDir | Out-Null
          tar -xf $archive -C $llvmDir --strip-components 1
          if ($LASTEXITCODE -ne 0) { Write-Error "tar extraction failed"; exit 1 }
          if (-not (Test-Path "$llvmDir\bin\llvm-config.exe")) {
            Write-Error "llvm-config.exe not found after extraction"
            exit 1
          }
          # clang+llvm 아카이브는 libxml2s.lib 을 번들하지 않음.
          # llvm-config --system-libs 가 libxml2s.lib 을 외부 정적 의존성으로 요구하므로
          # vcpkg 로 설치하고 LLVM lib 디렉터리에 배치 (링커가 이미 /LIBPATH:C:\LLVM\lib 를 검색).
          Write-Host "Installing libxml2 (static) via vcpkg..."
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkgRoot\vcpkg.exe" install libxml2:x64-windows-static-md --no-print-usage
          $vcpkgLib = "$vcpkgRoot\installed\x64-windows-static-md\lib"
          # LLVM 이 기대하는 's' (static) 접미사로 복사
          Copy-Item "$vcpkgLib\libxml2.lib" "$llvmDir\lib\libxml2s.lib"
          # libxml2 의 전이 의존성(zlib 등)도 링커 검색 경로에 포함
          Get-ChildItem "$vcpkgLib\*.lib" | Where-Object { $_.Name -ne "libxml2.lib" } |
            ForEach-Object { Copy-Item $_.FullName "$llvmDir\lib\$($_.Name)" -Force }
          Add-Content -Path $env:GITHUB_ENV -Value "LLVM_SYS_211_PREFIX=$llvmDir"
          Add-Content -Path $env:GITHUB_PATH -Value "$llvmDir\bin"
          Write-Host "LLVM $ver ready at $llvmDir"

      # ── 빌드 & 검사 ──────────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run built-in tests
        run: cargo run --release -- test

      # ── VS Code 확장 ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension deps
        working-directory: editors/vscode
        run: npm ci --ignore-scripts || npm install

      # ── 아티팩트 업로드 ───────────────────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kyte-${{ runner.os }}
          path: target/release/kyte${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: ignore
