name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LLVM_VERSION: "21.1"

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # KyleMayes/install-llvm-action downloads the official clang+llvm pre-built
      # archive (not the NSIS installer), extracts it, and sets LLVM_SYS_211_PREFIX
      # automatically via `env: true` — works on Linux, macOS, and Windows.
      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}
          env: true

      # ── 빌드 & 검사 ──────────────────────────────────────────────────────────
      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - name: Run built-in tests
        run: cargo run --release -- test

      # ── VS Code 확장 ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension deps
        working-directory: editors/vscode
        run: npm ci --ignore-scripts || npm install

      # ── 아티팩트 업로드 ───────────────────────────────────────────────────────
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kyte-${{ runner.os }}
          path: target/release/kyte${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: ignore
